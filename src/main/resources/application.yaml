server:
  port: 8000
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha
spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  application:
    name: recruit
  servlet:
    multipart:
      enabled: true
      max-file-size: ${RECRUIT_ATTACHMENT_MULTIPART_MAX_FILE_SIZE:25MB}
      max-request-size: ${RECRUIT_ATTACHMENT_MULTIPART_MAX_REQUEST_SIZE:105MB}
  Jackson:
    deserialization:
      fail-on-unknown-properties: false
  jpa:
    hibernate:
      # 스키마는 Hibernate ddl-auto 로 생성/갱신한다(별도 migration 프레임워크 없음).
      # 신규 테이블(예: common_code)은 수동 DDL 없이 자동 생성된다. 운영(MariaDB)에서는
      # validate/none + 관리형 DDL 로 전환하는 것을 권장한다.
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
#  datasource:
#    username: ENC()
#    password: ENC()
#    url: ENC()
#    driver-class-name: org.mariadb.jdbc.Driver
  datasource:
    url: jdbc:h2:~/recruit;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
crypto:
  aes:
    key: ${AES_SECRET_KEY}
audit:
  # 감사 연결용 HMAC pepper(Phase 09a). 누락 시 기본적으로 기동 실패(fail-safe, profile 이름과 무관).
  hmac-secret: ${AUDIT_HMAC_SECRET:}
  # secret 미설정 시 fallback secret 허용 여부(9a 리뷰 보완). local 개발에서만 명시적으로 true 로 켠다.
  # (예: AUDIT_ALLOW_FALLBACK_SECRET=true) prod profile 에서는 true 여도 fallback 이 거부된다.
  allow-fallback-secret: ${AUDIT_ALLOW_FALLBACK_SECRET:false}
recruit:
  export:
    max-rows: ${RECRUIT_EXPORT_MAX_ROWS:50000}
  upload:
    max-rows: ${RECRUIT_UPLOAD_MAX_ROWS:10000}
    max-file-size: ${RECRUIT_UPLOAD_MAX_FILE_SIZE:5MB}
  pdf:
    font-classpath: ${RECRUIT_PDF_FONT_CLASSPATH:fonts/NanumGothic-Regular.ttf}
  attachment:
    storage-root: ${RECRUIT_ATTACHMENT_STORAGE_ROOT:attachments}
    max-file-size: ${RECRUIT_ATTACHMENT_MAX_FILE_SIZE:20MB}
    max-files-per-application: ${RECRUIT_ATTACHMENT_MAX_FILES_PER_APPLICATION:20}
    max-total-size-per-application: ${RECRUIT_ATTACHMENT_MAX_TOTAL_SIZE_PER_APPLICATION:100MB}
    allowed-extensions: ${RECRUIT_ATTACHMENT_ALLOWED_EXTENSIONS:pdf,jpg,jpeg,png,doc,docx,xls,xlsx,hwp,hwpx}
    allowed-content-types: ${RECRUIT_ATTACHMENT_ALLOWED_CONTENT_TYPES:application/pdf,image/jpeg,image/png,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/x-hwp,application/haansofthwp,application/vnd.hancom.hwpx}
