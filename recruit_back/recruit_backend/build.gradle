plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.shinyoung'
version = '0.0.1-SNAPSHOT'
description = 'New recruit project'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-quartz'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:3.0.5'
	implementation 'org.mariadb.jdbc:mariadb-java-client'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'org.springframework.security:spring-security-ldap'
	implementation 'org.springframework.ldap:spring-ldap-core'
	implementation 'org.springframework.boot:spring-boot-h2console:4.0.5'
	implementation 'org.jsoup:jsoup:1.22.2'
	implementation 'org.apache.poi:poi-ooxml:5.3.0'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'
	// 공개 저장소에 없는 모듈(NICE 체크플러스 NiceID.jar, 사내 라이브러리)은 libs/ 에 두고 전부 참조한다.
	implementation fileTree('libs') { include '*.jar' }
	runtimeOnly 'com.h2database:h2'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	// Boot 4 는 테스트 슬라이스를 모듈별로 나눈다. MockMvc(@AutoConfigureMockMvc)는 이 아티팩트에 있다.
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
//	testImplementation 'org.testcontainers:mysql'
	testImplementation 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// 캐시된 Spring 테스트 컨텍스트(service 테스트만 약 29개, 개당 약 25MB)가 Gradle 기본 512m 힙을 넘겨 OOM이 난다.
	maxHeapSize = '2g'
	// NICE 모듈이 JDK 내부 클래스 com.sun.crypto.provider.SunJCE 를 직접 만든다.
	// 없으면 Java 9+ 에서 IllegalAccessError. 레거시 기동 스크립트도 같은 플래그를 쓴다.
	jvmArgs '--add-exports', 'java.base/com.sun.crypto.provider=ALL-UNNAMED'
}

tasks.named('bootRun') {
	// NICE 모듈 JVM 플래그. test 블록 주석 참고.
	jvmArgs '--add-exports', 'java.base/com.sun.crypto.provider=ALL-UNNAMED'
}
