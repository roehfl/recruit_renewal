springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha
spring:
  datasource:
    username: sa
    password:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
  servlet:
    multipart:
      enabled: true
crypto:
  aes:
    key: ${AES_SECRET_KEY}
audit:
  hmac-secret: test-audit-hmac-pepper-0001
recruit:
  attachment:
    storage-root: build/test-attachments
