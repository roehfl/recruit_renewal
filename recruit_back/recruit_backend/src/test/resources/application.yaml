springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha
spring:
  datasource:
    username: sa
    password:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
  servlet:
    multipart:
      enabled: true
crypto:
  aes:
    key: ${AES_SECRET_KEY}
audit:
  hmac-secret: test-audit-hmac-pepper-0001
recruit:
  nice:
    # 테스트는 NICE 실모듈을 쓰지 않는다. 모듈은 자기 암호문을 복호화하지 못해 왕복 테스트가 불가능하다.
    mock-enabled: true
    # 기존 로그인 테스트는 NICE 없이 로그인한다. 2차 인증 동작은 전용 테스트가 켜서 검증한다.
    login-two-factor-enabled: false
  attachment:
    storage-root: build/test-attachments
  cors:
    allowed-origins: http://localhost:5173,https://rec.shinyoung.com,https://shinrecruitdev.shinyoung.com
  message:
    gateway: logging
  # MockMvc 요청은 X-Requested-With 를 붙이지 않는다. 필터 자체는 CsrfHeaderFilterTest 가 검증한다.
  csrf:
    header-required: false
  # 한 컨텍스트에서 같은 계정·이메일을 여러 테스트가 쓰므로 한도를 크게 둔다. 한도 동작은 단위 테스트가 검증한다.
  auth-attempt-limit:
    login-max-failures: 10000
    code-max-sends: 10000
    code-max-failures: 10000
node:
  # TRNodeEngine 은 항상 빈으로 뜨므로 키가 있어야 한다. 테스트는 TR 노드를 부르지 않는다.
  url: ""
