springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha
spring:
  datasource:
    username: sa
    password:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
  servlet:
    multipart:
      enabled: true
crypto:
  aes:
    key: ${AES_SECRET_KEY}
audit:
  hmac-secret: test-audit-hmac-pepper-0001
recruit:
  nice:
    # 테스트는 NICE 실모듈을 쓰지 않는다. 모듈은 자기 암호문을 복호화하지 못해 왕복 테스트가 불가능하다.
    mock-enabled: true
  attachment:
    storage-root: build/test-attachments
